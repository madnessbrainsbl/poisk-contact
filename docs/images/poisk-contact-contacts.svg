<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img"><title>PoiskContact product illustration</title><desc>Source-informed illustration with fictional data; not an application screenshot.</desc><g font-family="Segoe UI, DejaVu Sans, sans-serif"><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#101014" stroke="none"/><text x="64" y="55" font-size="17" fill="#22c55e" font-weight="700">POISKCONTACT PRO  /  WINDOWS</text><text x="62" y="117" font-size="44" fill="#fafafa" font-weight="600">Review the evidence. Keep the context.</text><text x="64" y="154" font-size="19" fill="#a1a1aa" font-weight="400">Native desktop research. Local contact management. Built with Rust and egui.</text><rect x="62" y="188" width="1476" height="718" rx="16" fill="#09090b" stroke="#27272a"/><rect x="62" y="188" width="214" height="718" rx="16" fill="#0c0c0e" stroke="#27272a"/><text x="88" y="232" font-size="23" fill="#fafafa" font-weight="700">PoiskContact</text><text x="88" y="274" font-size="12" fill="#a1a1aa" font-weight="600">WORKSPACE</text><text x="93" y="320" font-size="16" fill="#a1a1aa" font-weight="400">Find contacts</text><rect x="78" y="342" width="182" height="40" rx="8" fill="#222226" stroke="#38383d"/><path d="M79 352L79 372" stroke="#22c55e"/><text x="93" y="368" font-size="16" fill="#fafafa" font-weight="600">Contacts</text><text x="93" y="416" font-size="16" fill="#a1a1aa" font-weight="400">Email template</text><text x="93" y="464" font-size="16" fill="#a1a1aa" font-weight="400">Mail and sending</text><text x="93" y="512" font-size="16" fill="#a1a1aa" font-weight="400">Activity log</text><rect x="82" y="592" width="174" height="124" rx="10" fill="#121215" stroke="#27272a"/><text x="98" y="622" font-size="12" fill="#a1a1aa" font-weight="600">SENDER</text><text x="98" y="656" font-size="14" fill="#fafafa" font-weight="400">Configure your sender</text><text x="98" y="686" font-size="12" fill="#a1a1aa" font-weight="400">No email configured</text><rect x="82" y="738" width="174" height="138" rx="10" fill="#121215" stroke="#27272a"/><text x="98" y="770" font-size="12" fill="#a1a1aa" font-weight="600">LOCAL WORKSPACE</text><text x="98" y="807" font-size="14" fill="#fafafa" font-weight="400">Review before use</text><text x="98" y="846" font-size="13" fill="#22c55e" font-weight="400">Illustrative demo</text><text x="310" y="236" font-size="28" fill="#fafafa" font-weight="600">Contacts</text><text x="310" y="271" font-size="17" fill="#a1a1aa" font-weight="400">Review company records, keep notes and inspect source evidence.</text><rect x="310" y="295" width="156" height="38" rx="10" fill="#121215" stroke="#27272a"/><text x="323" y="320" font-size="15" fill="#fafafa" font-weight="600">File and export</text><rect x="480" y="295" width="152" height="38" rx="10" fill="#121215" stroke="#27272a"/><text x="493" y="320" font-size="15" fill="#fafafa" font-weight="600">Select contacts</text><rect x="646" y="295" width="156" height="38" rx="10" fill="#121215" stroke="#27272a"/><text x="659" y="320" font-size="15" fill="#fafafa" font-weight="600">Database tools</text><rect x="310" y="358" width="1194" height="68" rx="10" fill="#121215" stroke="#27272a"/><text x="333" y="399" font-size="16" fill="#a1a1aa" font-weight="400">Search company, email or name...</text><rect x="1080" y="373" width="140" height="38" rx="10" fill="#121215" stroke="#27272a"/><text x="1093" y="398" font-size="15" fill="#fafafa" font-weight="600">Priority: All</text><rect x="1234" y="373" width="142" height="38" rx="10" fill="#121215" stroke="#27272a"/><text x="1247" y="398" font-size="15" fill="#fafafa" font-weight="600">Status: All</text><text x="334" y="472" font-size="13" fill="#a1a1aa" font-weight="600">COMPANY</text><text x="766" y="472" font-size="13" fill="#a1a1aa" font-weight="600">EMAIL</text><text x="1210" y="472" font-size="13" fill="#a1a1aa" font-weight="600">CITY</text><rect x="310" y="496" width="1194" height="78" rx="10" fill="#121215" stroke="#27272a"/><text x="335" y="529" font-size="20" fill="#fafafa" font-weight="600">Northstar Studio (Demo)</text><text x="335" y="554" font-size="14" fill="#a1a1aa" font-weight="400">Fictional company record</text><text x="766" y="540" font-size="17" fill="#fafafa" font-weight="400">hello@northstar.example.invalid</text><text x="1210" y="540" font-size="17" fill="#fafafa" font-weight="400">Berlin</text><rect x="310" y="583" width="1194" height="78" rx="10" fill="#121215" stroke="#27272a"/><text x="335" y="616" font-size="20" fill="#fafafa" font-weight="600">Harbor Labs (Demo)</text><text x="335" y="641" font-size="14" fill="#a1a1aa" font-weight="400">Fictional company record</text><text x="766" y="627" font-size="17" fill="#fafafa" font-weight="400">team@harbor.example.invalid</text><text x="1210" y="627" font-size="17" fill="#fafafa" font-weight="400">Berlin</text><rect x="310" y="670" width="1194" height="78" rx="10" fill="#121215" stroke="#27272a"/><text x="335" y="703" font-size="20" fill="#fafafa" font-weight="600">Evergreen Works (Demo)</text><text x="335" y="728" font-size="14" fill="#a1a1aa" font-weight="400">Fictional company record</text><text x="766" y="714" font-size="17" fill="#fafafa" font-weight="400">contact@evergreen.example.invalid</text><text x="1210" y="714" font-size="17" fill="#fafafa" font-weight="400">Munich</text><text x="334" y="812" font-size="16" fill="#a1a1aa" font-weight="400">All example domains are reserved .invalid addresses.</text><text x="334" y="846" font-size="16" fill="#a1a1aa" font-weight="400">No collection, verification or email sending is simulated here.</text><text x="64" y="949" font-size="14" fill="#a1a1aa" font-weight="600">SOURCE-INFORMED ILLUSTRATION  ·  FICTIONAL DEMO DATA</text><text x="1110" y="949" font-size="14" fill="#a1a1aa" font-weight="400">github.com/madnessbrainsbl/poisk-contact</text></g></svg>