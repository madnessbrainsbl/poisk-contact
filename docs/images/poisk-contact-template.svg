<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img"><title>PoiskContact product illustration</title><desc>Source-informed illustration with fictional data; not an application screenshot.</desc><g font-family="Segoe UI, DejaVu Sans, sans-serif"><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#101014" stroke="none"/><text x="64" y="55" font-size="17" fill="#22c55e" font-weight="700">POISKCONTACT PRO  /  WINDOWS</text><text x="62" y="117" font-size="44" fill="#fafafa" font-weight="600">Personalize with a preview.</text><text x="64" y="154" font-size="19" fill="#a1a1aa" font-weight="400">Native desktop research. Local contact management. Built with Rust and egui.</text><rect x="62" y="188" width="1476" height="718" rx="16" fill="#09090b" stroke="#27272a"/><rect x="62" y="188" width="214" height="718" rx="16" fill="#0c0c0e" stroke="#27272a"/><text x="88" y="232" font-size="23" fill="#fafafa" font-weight="700">PoiskContact</text><text x="88" y="274" font-size="12" fill="#a1a1aa" font-weight="600">WORKSPACE</text><text x="93" y="320" font-size="16" fill="#a1a1aa" font-weight="400">Find contacts</text><text x="93" y="368" font-size="16" fill="#a1a1aa" font-weight="400">Contacts</text><rect x="78" y="390" width="182" height="40" rx="8" fill="#222226" stroke="#38383d"/><path d="M79 400L79 420" stroke="#22c55e"/><text x="93" y="416" font-size="16" fill="#fafafa" font-weight="600">Email template</text><text x="93" y="464" font-size="16" fill="#a1a1aa" font-weight="400">Mail and sending</text><text x="93" y="512" font-size="16" fill="#a1a1aa" font-weight="400">Activity log</text><rect x="82" y="592" width="174" height="124" rx="10" fill="#121215" stroke="#27272a"/><text x="98" y="622" font-size="12" fill="#a1a1aa" font-weight="600">SENDER</text><text x="98" y="656" font-size="14" fill="#fafafa" font-weight="400">Configure your sender</text><text x="98" y="686" font-size="12" fill="#a1a1aa" font-weight="400">No email configured</text><rect x="82" y="738" width="174" height="138" rx="10" fill="#121215" stroke="#27272a"/><text x="98" y="770" font-size="12" fill="#a1a1aa" font-weight="600">LOCAL WORKSPACE</text><text x="98" y="807" font-size="14" fill="#fafafa" font-weight="400">Review before use</text><text x="98" y="846" font-size="13" fill="#22c55e" font-weight="400">Illustrative demo</text><text x="310" y="236" font-size="28" fill="#fafafa" font-weight="600">Email template</text><text x="310" y="271" font-size="17" fill="#a1a1aa" font-weight="400">Write once, personalize for each contact. Preview before sending.</text><rect x="310" y="295" width="150" height="38" rx="10" fill="#fafafa" stroke="#27272a"/><text x="323" y="320" font-size="15" fill="#09090b" font-weight="600">Save template</text><rect x="474" y="295" width="194" height="38" rx="10" fill="#121215" stroke="#27272a"/><text x="487" y="320" font-size="15" fill="#fafafa" font-weight="600">Load saved template</text><rect x="682" y="295" width="178" height="38" rx="10" fill="#121215" stroke="#27272a"/><text x="695" y="320" font-size="15" fill="#fafafa" font-weight="600">Built-in templates</text><rect x="310" y="360" width="575" height="510" rx="10" fill="#121215" stroke="#27272a"/><text x="335" y="401" font-size="18" fill="#fafafa" font-weight="600">Subject</text><rect x="334" y="424" width="527" height="46" rx="10" fill="#09090b" stroke="#27272a"/><text x="350" y="454" font-size="18" fill="#fafafa" font-weight="400">Question for {company}</text><text x="335" y="516" font-size="18" fill="#fafafa" font-weight="600">Message</text><rect x="334" y="537" width="527" height="290" rx="10" fill="#09090b" stroke="#27272a"/><text x="350" y="575" font-size="17" fill="#fafafa" font-weight="400">Hi {name},</text><text x="350" y="604" font-size="17" fill="#fafafa" font-weight="400"></text><text x="350" y="633" font-size="17" fill="#fafafa" font-weight="400">I would like to discuss a possible</text><text x="350" y="662" font-size="17" fill="#fafafa" font-weight="400">collaboration with {company}.</text><text x="350" y="691" font-size="17" fill="#fafafa" font-weight="400">Would a short introduction be useful?</text><text x="350" y="720" font-size="17" fill="#fafafa" font-weight="400"></text><text x="350" y="749" font-size="17" fill="#fafafa" font-weight="400">Best regards,</text><text x="350" y="778" font-size="17" fill="#fafafa" font-weight="400">{sender_name}</text><rect x="909" y="360" width="595" height="510" rx="10" fill="#121215" stroke="#27272a"/><text x="935" y="401" font-size="20" fill="#fafafa" font-weight="600">Email preview</text><text x="935" y="444" font-size="17" fill="#a1a1aa" font-weight="400">Example for Northstar Studio (Demo)</text><rect x="935" y="469" width="165" height="38" rx="10" fill="#121215" stroke="#27272a"/><text x="948" y="494" font-size="15" fill="#fafafa" font-weight="600">Refresh preview</text><rect x="1115" y="469" width="164" height="38" rx="10" fill="#121215" stroke="#27272a"/><text x="1128" y="494" font-size="15" fill="#fafafa" font-weight="600">Shuffle variations</text><text x="935" y="570" font-size="17" fill="#fafafa" font-weight="400">Subject: Question for Northstar Studio</text><text x="935" y="602" font-size="17" fill="#fafafa" font-weight="400"></text><text x="935" y="634" font-size="17" fill="#fafafa" font-weight="400">Hi Alex Example,</text><text x="935" y="666" font-size="17" fill="#fafafa" font-weight="400"></text><text x="935" y="698" font-size="17" fill="#fafafa" font-weight="400">I would like to discuss a possible</text><text x="935" y="730" font-size="17" fill="#fafafa" font-weight="400">collaboration with Northstar Studio.</text><text x="935" y="762" font-size="17" fill="#fafafa" font-weight="400">Would a short introduction be useful?</text><text x="64" y="949" font-size="14" fill="#a1a1aa" font-weight="600">SOURCE-INFORMED ILLUSTRATION  ·  FICTIONAL DEMO DATA</text><text x="1110" y="949" font-size="14" fill="#a1a1aa" font-weight="400">github.com/ma